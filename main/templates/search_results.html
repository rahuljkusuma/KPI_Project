<!DOCTYPE html>
<html>
<head>
    <title>Company Search</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <input type="text" id="search_input" placeholder="Search for companies">
    <ul id="company_list"></ul>

    <script>
        $(document).ready(function() {
        $('#search_input').keyup(function() {
        var term = $(this).val();
        if (term.length > 2) {  // Only make requests after 2 characters
        $.getJSON('/search_companies/?term=' + term, function(data) {
        $('#company_list').empty();
        $.each(data, function(index, value) {
        $('#company_list').append('<li>' + value + '</li>');
        });
        });
        } else {
        $('#company_list').empty();
        }
        });
        });
    </script>
</body>
</html>
